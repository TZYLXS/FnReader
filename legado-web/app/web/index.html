<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <meta name="app-version" content="1.8.1" />
  <title>阅读</title>
  <link rel="icon" href="./icon.svg" />
  <link rel="stylesheet" href="./style.css?v=1.8.1" />
</head>
<body>
  <div id="app">
    <main id="view" class="view"></main>
    <nav id="tabbar" class="tabbar">
      <a href="#/shelf" data-tab="shelf"><span class="ico">书</span><span>书架</span></a>
      <a href="#/search" data-tab="search"><span class="ico">搜</span><span>搜索</span></a>
      <a href="#/sources" data-tab="sources"><span class="ico">源</span><span>书源</span></a>
      <a href="#/settings" data-tab="settings"><span class="ico">设</span><span>设置</span></a>
    </nav>
  </div>
  <div id="toast" class="toast"></div>
  <div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
  <script>
// 版本自愈：装的是新包但 WebView 还缓存着旧页面时，自动带版本参数重载一次
(function () {
  try {
    var meta = document.querySelector('meta[name="app-version"]');
    if (!meta) return;
    fetch('./api/health?ts=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.version) return;
        var u = new URL(location.href);
        if (u.searchParams.get('b') === String(d.version)) return; // 已经重载过，避免死循环
        if (String(d.version) !== String(meta.getAttribute('content'))) {
          u.searchParams.set('b', d.version);
          location.replace(u.toString());
        }
      })
      .catch(function () {});
  } catch (e) {}
})();
</script>
  <script src="./app.js?v=1.8.1"></script>
</body>
</html>
