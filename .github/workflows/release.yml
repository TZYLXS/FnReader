name: release

# 打 tag 即发布：直接使用仓库里已构建好的 dist/legado-web.fpk，
# 不依赖构建环境，保证产物一定出现在 Releases。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v1.6.10）'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check artifact
        run: |
          ls -lh dist/legado-web.fpk
          echo "version=$(grep '^version=' legado-web/manifest | cut -d= -f2)" >> $GITHUB_OUTPUT
        id: meta

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: 阅读 ${{ inputs.tag || github.ref_name }}
          body: |
            飞牛 fnOS 应用「阅读」${{ inputs.tag || github.ref_name }}。

            安装：应用中心 → 手动安装 → 选择 `legado-web.fpk`。
            升级请先卸载再安装（fnOS 的覆盖升级不会真正替换文件），数据目录会保留。

            详细说明见 [docs/使用说明.md](docs/使用说明.md)，版本记录见 [docs/更新日志.md](docs/更新日志.md)。
          files: dist/legado-web.fpk
          generate_release_notes: true
          fail_on_unmatched_files: true
