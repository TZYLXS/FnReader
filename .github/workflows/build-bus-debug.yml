name: build-bus-debug

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/bus-debug-app/**'
      - '.github/workflows/build-bus-debug.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="0.0.$(date +%y%m%d)"
          fi
          IFS=. read -r a b c <<< "$V"
          CODE=$(( (10#${a:-0})*1000000 + (10#${b:-0})*1000 + (10#${c:-0}) ))
          echo "name=1.0.$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "debug app version: 1.0.$V ($CODE)"

      - name: Build debug APK
        run: gradle -p tools/bus-debug-app assembleDebug --no-daemon --stacktrace -PbusVersion=${{ steps.ver.outputs.name }} -PbusVersionCode=${{ steps.ver.outputs.code }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bus-debug-apk
          path: tools/bus-debug-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Copy APK for release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist
          cp tools/bus-debug-app/app/build/outputs/apk/debug/app-debug.apk dist/bus-debug.apk
          ls -lh dist/bus-debug.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/bus-debug.apk
          overwrite_files: true
